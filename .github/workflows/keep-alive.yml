name: Keep Render Alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend
        run: |
          curl -fsS --retry 3 --retry-delay 20 --max-time 90 \
            https://timetable-generator-y5vg.onrender.com/api/health
