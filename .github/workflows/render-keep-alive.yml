name: Render Keep-Alive

  on:
    schedule:
      - cron: '0 */20 * * *'  # every 20 minutes
    workflow_dispatch:

  jobs:
    ping:
      runs-on: ubuntu-latest
      steps:
        - name: Ping Render service
          run: |
            curl -s "${{ secrets.RENDER_URL }}" -o /dev/null -w "HTTP %{http_code}\n"

