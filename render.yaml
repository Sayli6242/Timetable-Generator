# Render Blueprint for the FastAPI backend.
# Render dashboard -> New -> Blueprint -> pick this repo. It asks for the
# values marked sync: false.
services:
  - type: web
    name: timetable-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Your Vercel URL, e.g. https://timetable-generator.vercel.app
      - key: CORS_ORIGINS
        sync: false
      # Optional: also allow Vercel preview deployments of this project.
      - key: CORS_ORIGIN_REGEX
        value: "https://timetable-generator.*\\.vercel\\.app"
